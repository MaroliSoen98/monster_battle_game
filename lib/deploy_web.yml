name: Build and Deploy Flutter Web

on:
  push:
    branches:
      - main # Akan otomatis jalan ketika ada push ke branch main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release --base-href "/<NAMA_REPO>/" # <-- GANTI <NAMA_REPO> DENGAN NAMA REPOSITORY-MU (misal: "/monster-battle-game/")

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web